# Collects the latest updates from the sources in config/sources.yml, optionally reviews them
# with Google Gemini, saves the results under site/ and publishes the site on GitHub Pages.
#
# One-time setup
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Optional, for the AI review (briefing, relevance, proposed data updates)
#   Settings -> Secrets and variables -> Actions -> New repository secret: GEMINI_API_KEY
#   Settings -> Actions -> General -> tick "Allow GitHub Actions to create and approve pull requests"

name: Update and publish

on:
  schedule:
    # Twice a day, 05:15 and 15:15 UTC. GitHub may start scheduled runs a few minutes late.
    - cron: "15 5,15 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write # commit the collected updates back to the repository
  pull-requests: write # open the pull request with proposed data updates
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PROPOSAL_BRANCH: ai-proposals
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Always work on the newest state of the branch, also when an older run is started again.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect updates from feeds
        run: python scripts/fetch_feeds.py

      - name: Review with AI (skipped without a GEMINI_API_KEY secret)
        # The review is an extra: if it hangs or fails, the update and the website go ahead.
        timeout-minutes: 12
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A run started by hand writes a fresh briefing; scheduled runs do so once a day.
          AI_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          export AI_PR_OPEN="$(gh pr list --head "$PROPOSAL_BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo '')"
          python -u scripts/ai_review.py

      - name: Save collected updates to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data site/feed.xml site/calendar.ics
          if git diff --staged --quiet; then
            echo "No new updates to save."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            # If the branch moved meanwhile, keep this run's freshly generated files.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; echo "::warning::Could not save the updates this time; the next run will."; git reset --hard "origin/${GITHUB_REF_NAME}"; }
            git push || echo "::warning::Could not push the updates this time; the next run will."
          fi

      - name: Open or update the pull request with proposed changes
        run: |
          if [ ! -f .ai/pr_body.md ]; then echo "No proposals on this run."; exit 0; fi
          git checkout -B "$PROPOSAL_BRANCH"
          cp .ai/regulations.json site/data/regulations.json
          if [ -d .ai/learn ]; then cp .ai/learn/*.json site/data/learn/; fi
          git add site/data/regulations.json site/data/learn
          if git diff --staged --quiet; then
            echo "The proposals are already part of the data."
          else
            git commit -m "Proposed updates to regulation data and learning pages"
            git push --force origin "$PROPOSAL_BRANCH"
            if [ "$(gh pr list --head "$PROPOSAL_BRANCH" --state open --json number --jq 'length')" = "0" ]; then
              gh pr create --base "${GITHUB_REF_NAME}" --head "$PROPOSAL_BRANCH" \
                --title "Proposed updates to regulation data" --body-file .ai/pr_body.md \
                || echo "::warning title=Pull request not created::Tick 'Allow GitHub Actions to create and approve pull requests' under Settings, Actions, General. The proposals are shown on the website meanwhile."
            else
              gh pr edit "$PROPOSAL_BRANCH" --body-file .ai/pr_body.md || true
            fi
          fi
          git checkout "${GITHUB_REF_NAME}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
